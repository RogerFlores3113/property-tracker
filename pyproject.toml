[project]
name = "property-helper"
version = "0.1.0"
description = "Local-first helper for your own apartment or house hunt, usable from a web UI and from any MCP client."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "mcp>=1.9,<2",
    "platformdirs>=4.0",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
prophelper = "prophelper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prophelper"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "prophelper/skills"
".claude-plugin" = "prophelper/.claude-plugin"

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
